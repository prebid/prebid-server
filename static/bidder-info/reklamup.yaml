aliasOf: "teqblaze"
# We have the following regional endpoint domains: 'eu-node' - for EU, 'node' - for US_EAST
# Please deploy this config in each of your datacenters with the appropriate regional subdomain
endpoint: "https://REGION.reklamup.com/pserver"
maintainer:
  email: "support@reklamup.com"
gvlVendorID: 1619
capabilities:
  site:
    mediaTypes:
      - banner
      - video
      - native
  app:
    mediaTypes:
      - banner
      - video
      - native
userSync:
  redirect:
    url: "https://usersync.reklamup.com/pbserver?gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&gpp={{.GPP}}&gpp_sid={{.GPPSID}}&redir={{.RedirectURL}}"
    userMacro: "[UID]"
  iframe:
    url: "https://usersync.reklamup.com/pbserverIframe?gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&gpp={{.GPP}}&gpp_sid={{.GPPSID}}&pbserverUrl={{.RedirectURL}}"
    userMacro: "[UID]"
