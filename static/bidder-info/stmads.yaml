aliasOf: "teqblaze"
endpoint: 'https://rtb-ssp-eu.streamads.media/pserver'
maintainer:
  email: 'support@streamads.media'
capabilities:
  site:
    mediaTypes:
      - banner
      - video
      - native
  app:
    mediaTypes:
      - banner
      - video
      - native
userSync:
  redirect:
    url: "https://sync.streamads.media/pbserver?gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&gpp={{.GPP}}&gpp_sid={{.GPPSID}}&redir={{.RedirectURL}}"
    userMacro: "[UID]"
  iframe:
    url: "https://sync.streamads.media/pbserverIframe?gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&gpp={{.GPP}}&gpp_sid={{.GPPSID}}&pbserverUrl={{.RedirectURL}}"
    userMacro: "[UID]"
