endpoint: "https://ads.theagenticx.ai/ads/rtb/prebid/server"
endpointCompression: gzip
maintainer:
  email: prebid@aidigital.com
openrtb:
  version: 2.6
capabilities:
  app:
    mediaTypes:
      - banner
      - video
      - audio
  site:
    mediaTypes:
      - banner
      - video
      - audio
userSync:
  # ssp_id is a fixed ID Agenticx assigned to this PBS integration (not per-publisher).
  iframe:
    url: "https://sync.theagenticx.ai/sync?ssp_id=630141&gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&gpp={{.GPP}}&gpp_sid={{.GPPSID}}&iframe_enabled=true&redir={{.RedirectURL}}"
    userMacro: "[UID]"
  redirect:
    url: "https://sync.theagenticx.ai/sync?ssp_id=630141&gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&gpp={{.GPP}}&gpp_sid={{.GPPSID}}&iframe_enabled=false&redir={{.RedirectURL}}"
    userMacro: "[UID]"
