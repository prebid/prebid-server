# We have the following regional endpoint domains: us-e.floxis.tech, eu.floxis.tech and apac.floxis.tech
# Please deploy this config in each of your datacenters with the appropriate regional subdomain
endpoint: "https://us-e.floxis.tech/pbs"
endpointCompression: gzip
maintainer:
  email: prebid@floxis.tech
gvlVendorID: 1609
modifyingVastXmlAllowed: false
openrtb:
  version: 2.6
  gpp-supported: true
capabilities:
  app:
    mediaTypes:
      - banner
      - video
      - native
      - audio
  site:
    mediaTypes:
      - banner
      - video
      - native
      - audio
userSync:
  redirect:
    url: "https://px-us-e.floxis.tech/sync?gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&gpp={{.GPP}}&gpp_sid={{.GPPSID}}&us_privacy={{.USPrivacy}}&dest={{.RedirectURL}}"
    userMacro: "${USER_ID}"
